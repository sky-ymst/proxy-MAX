<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>暗号化プロキシビューワー(実験用)</title>
<style>
  html, body { margin:0; padding:0; height:100%; }
  #status {
    font-family: sans-serif;
    font-size: 13px;
    color: #666;
    padding: 6px 10px;
    background: #f5f5f5;
    border-bottom: 1px solid #ddd;
  }
  #content-frame {
    width: 100%;
    height: calc(100% - 30px);
    border: none;
  }
</style>
</head>
<body>

<div id="status">読み込み中...</div>
<iframe id="content-frame"></iframe>

<script>
// ==============================
// クライアント側の復号処理
// サーバーが 2層目(AES-A) -> 3層目(AES-B) -> 4層目(XOR-C) の順で暗号化しているため
// ここでは逆順(4層目 -> 3層目 -> 2層目)に復号する
// ==============================

function base64ToBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function xorDecrypt(bytes, keyBytes) {
  const out = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) {
    out[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
  }
  return out;
}

// AES-256-GCM復号 (Web Crypto API使用)
// 入力形式: [iv(12byte)] + [authTag(16byte)] + [暗号文]
async function aesDecrypt(bytes, rawKeyBytes) {
  const iv = bytes.slice(0, 12);
  const authTag = bytes.slice(12, 28);
  const ciphertext = bytes.slice(28);

  // Web Crypto の AES-GCM は 暗号文+authTag を連結して渡す仕様
  const combined = new Uint8Array(ciphertext.length + authTag.length);
  combined.set(ciphertext, 0);
  combined.set(authTag, ciphertext.length);

  const cryptoKey = await crypto.subtle.importKey(
    'raw', rawKeyBytes, { name: 'AES-GCM' }, false, ['decrypt']
  );

  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv },
    cryptoKey,
    combined
  );

  return new Uint8Array(decrypted);
}

async function loadAndDecrypt(pagePath) {
  const statusEl = document.getElementById('status');
  statusEl.textContent = '暗号化データを取得中...';

  const apiUrl = '/api/page?path=' + encodeURIComponent(pagePath || '/');
  const res = await fetch(apiUrl);
  const data = await res.json();

  if (data.error) {
    statusEl.textContent = 'エラー: ' + data.error;
    return;
  }

  const keyA = base64ToBuffer(data.keys.keyA);
  const keyB = base64ToBuffer(data.keys.keyB);
  const keyC = base64ToBuffer(data.keys.keyC);

  statusEl.textContent = '層4(XOR)を復号中...';
  let bytes = base64ToBuffer(data.encrypted);
  bytes = xorDecrypt(bytes, keyC);

  statusEl.textContent = '層3(AES-256-GCM)を復号中...';
  bytes = await aesDecrypt(bytes, keyB);

  statusEl.textContent = '層2(AES-256-GCM)を復号中...';
  bytes = await aesDecrypt(bytes, keyA);

  const html = new TextDecoder('utf-8').decode(bytes);

  statusEl.textContent = '復号完了・表示中';

  const iframe = document.getElementById('content-frame');
  iframe.srcdoc = html;
}

// 記事内リンククリック時、内部iframeからのpostMessageを受けて再読み込み
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'navigate') {
    loadAndDecrypt(event.data.path);
  }
});

// 初回読み込み
loadAndDecrypt('/');
</script>

</body>
</html>
