<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>skyrox2</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #bar { display: flex; padding: 8px; background: #222; gap: 6px; }
  #urlInput { flex: 1; padding: 8px; border-radius: 4px; border: none; }
  #goBtn { padding: 8px 16px; border: none; border-radius: 4px; background: #4a90d9; color: #fff; cursor: pointer; }
  #status { font-size: 12px; color: #888; padding: 4px 8px; }
  iframe { width: 100%; height: calc(100vh - 56px); border: none; display: block; }
</style>
</head>
<body>
  <div id="bar">
    <input id="urlInput" type="text" value="https://yamatoyagi.hatenablog.com">
    <button id="goBtn">移動</button>
  </div>
  <div id="status"></div>
  <iframe id="view" title="proxied content"></iframe>

<script>
const urlInput = document.getElementById('urlInput');
const goBtn = document.getElementById('goBtn');
const view = document.getElementById('view');
const status = document.getElementById('status');

function xorDecrypt(buf, key) {
  const out = new Uint8Array(buf.length);
  for (let i = 0; i < buf.length; i++) out[i] = buf[i] ^ key[i % key.length];
  return out;
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function aesDecrypt(buf, keyBytes) {
  const iv = buf.slice(0, 12);
  const tag = buf.slice(12, 28);
  const data = buf.slice(28);
  const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const combined = new Uint8Array(data.length + tag.length);
  combined.set(data, 0);
  combined.set(tag, data.length);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, combined);
  return new Uint8Array(plainBuf);
}

async function loadPage(url) {
  status.textContent = '読み込み中...';
  try {
    const res = await fetch('/api/page?url=' + encodeURIComponent(url));
    const data = await res.json();

    if (data.error) {
      status.textContent = 'エラー: ' + data.error;
      return;
    }

    let buf = base64ToBytes(data.payload);
    const xorKey = base64ToBytes(data.xorKey);
    const key2 = base64ToBytes(data.key2);
    const key1 = base64ToBytes(data.key1);

    buf = xorDecrypt(buf, xorKey);      // 層3を戻す
    buf = await aesDecrypt(buf, key2);  // 層2を戻す
    buf = await aesDecrypt(buf, key1);  // 層1を戻す

    const html = new TextDecoder('utf-8').decode(buf);
    view.srcdoc = html;
    urlInput.value = url;
    status.textContent = '表示中: ' + url;
  } catch (err) {
    status.textContent = '読み込みエラー: ' + err.message;
  }
}

goBtn.addEventListener('click', () => loadPage(urlInput.value.trim()));
urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadPage(urlInput.value.trim());
});

// 埋め込み内のリンククリックをここで受け取ってURLバーごと遷移
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'navigate' && e.data.url) {
    loadPage(e.data.url);
  }
});

// 初回ロード（index.htmlから ?url=... で渡された場合はそちらを優先）
const params = new URLSearchParams(location.search);
const initialUrl = params.get('url');
if (initialUrl) {
  urlInput.value = initialUrl;
}
loadPage(urlInput.value);
</script>
</body>
</html>
