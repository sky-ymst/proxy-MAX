<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>直接埋め込み</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #status { font-size: 12px; color: #888; padding: 8px; background: #222; }
  iframe { width: 100%; height: calc(100vh - 34px); border: none; display: block; }
</style>
</head>
<body>
  <div id="status"></div>
  <iframe id="view" title="embedded content"></iframe>

<script>
const statusEl = document.getElementById('status');
const view = document.getElementById('view');

const params = new URLSearchParams(location.search);
const url = params.get('url');

if (!url || !/^https?:\/\//i.test(url)) {
  statusEl.textContent = 'urlパラメータが指定されていません';
} else {
  statusEl.textContent = '表示中: ' + url;
  // サーバーを経由せず、ブラウザが直接このURLにアクセスします
  view.src = url;
}
</script>
</body>
</html>
